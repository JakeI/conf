
# Change prefix key to C-Space
unbind-key C-b
set-option -g prefix C-Space
bind-key C-Space send-prefix

# Split panes key rebind
bind | split-window -h
bind - split-window -v

# Reload shortcut
bind r source-file ~/.tmux.conf  \; display-message "Config reloaded..."

# Switch Panes bei using Alt-Vim_key
bind -n M-H select-pane -L
bind -n M-L select-pane -R
bind -n M-K select-pane -U
bind -n M-J select-pane -D
bind -n M-N select-window -n

##################
###  SESSIONS  ###
##################
# Reminder: `$` (after prefix) renames the current session -- with many
# sessions, keep the names short and meaningful.

# Switch sessions without prefix (creation order, wraps around)
# bind -n C-S-Left  switch-client -p
# bind -n C-S-Right switch-client -n
bind -n M-O switch-client -p
bind -n M-Z switch-client -n

# Kill the current session (asks for confirmation) but stay in tmux: it first
# switches to the next session, then kills the one we came from. The formats
# are expanded by run-shell BEFORE the switch, so the right session is killed.
# If it's the last session, tmux exits to the shell as usual.
bind X confirm-before -p "kill session '#S'? (y/n)" \
    "run-shell -b \"tmux switch-client -c '#{client_name}' -n; tmux kill-session -t '#{session_name}'\""

# Fuzzy session switcher: type to filter, Enter to switch, Esc to cancel.
# (display-popup passes the command to the shell without expanding formats,
# so the list-sessions format string goes through untouched -- keep the #s.)
bind S display-popup -E -w 60% -h 40% \
    "tmux list-sessions -F '#S#{?session_attached, (attached),}' \
    | fzf --prompt='session> ' --color=border:39,prompt:39 \
    | cut -d' ' -f1 | xargs -I{} tmux switch-client -t {}"

# Fuzzy new-session creator: pick a directory with fzf (roots configured in
# the script: /mnt/d/val, ~ -- edit ROOTS there to extend). Session name =
# directory basename, rooted there; switches if the session already points at
# that directory, else creates "<name>-2" etc. on basename collisions. Esc cancels.
bind N display-popup -E -w 70% -h 50% "~/conf/tmux/tmux-fzf-new-session.sh"

# Full session/window/pane tree browser (stock chooser, styled via popup-*)
bind s choose-tree -Zs

#bind -n M-P select-window -p # for some reason binding M-P will switch tabs and type 1$r0m every time I open nvim no idea why, I'll disable this shortcut for now

# Enable mouse interactions
set -g mouse on

# Use one-based window indexing
set  -g base-index 1
setw -g pane-base-index 1

# Enable 24 bit true colors
set -ga terminal-overrides ",xterm-kitty:Tc"

# No escape delay
set -sg escape-time 1

# use CSI to report wider range of keys
set -s extended-keys on

######################
### DESIGN CHANGES ###
######################
# []: https://www.hamvocke.com/blog/a-guide-to-customizing-your-tmux-conf/

# loud or quiet?
set -g visual-activity off
set -g visual-bell off
set -g visual-silence off
setw -g monitor-activity off
set -g bell-action none

# for nvim
set-option -g focus-events on
set-option -g default-terminal "screen-256color"
set-option -g terminal-features "xterm-256color:screen-256color"

# clipboard: let apps inside tmux (opencode, nvim) set the host clipboard via OSC52
set -g set-clipboard on
set -sa terminal-features ',xterm-256color:clipboard'
# opencode's TUI (OpenTUI) wraps OSC52 in a tmux DCS passthrough (ESC P tmux;...)
# — without this tmux silently drops it and copy never reaches the terminal
set -g allow-passthrough on
# fallback for tmux copy-mode yanks only (does not affect app OSC52)
set -s copy-command 'win32yank.exe -i --crlf'

#  modes
setw -g clock-mode-colour colour5
setw -g mode-style 'fg=colour255 bg=colour19 bold'

# panes
set -g pane-border-style 'fg=colour19 bg=colour0'
set -g pane-active-border-style 'bg=colour16 fg=colour19'
# set -g window-style 'fg=colour253,bg=colour236'
set -g window-style 'fg=colour253,bg=colour236'
set -g window-active-style 'fg=colour252,bg=colour234'
#set -g window-active-style 'fg=colour252,bg=colour234'
# set -g window-style 'fg=colour253,bg=#383C34'
# set -g window-active-style 'fg=colour252,bg=#282C34'

# statusbar
set -g status-position bottom
set -g status-justify left
set -g status-style 'bg=colour39 fg=colour137 dim'
set -g status-left '#[fg=colour233,bg=colour8,bold] #S #[default]'
set -g status-right '#[fg=colour233,bg=colour8] %y年%m月%d号 | %H:%M:%S '
set -g status-right-length 50
set -g status-left-length 30

# Show the session (and window) name in the terminal's own title bar
set -g set-titles on
set -g set-titles-string '#S: #W'

setw -g window-status-current-style 'fg=colour1 bg=colour19 bold'
setw -g window-status-current-format ' #I#[fg=colour249]:#[fg=colour255]#W#[fg=colour249]#F '

setw -g window-status-style 'fg=colour9 bg=colour25'
setw -g window-status-format ' #I#[fg=colour237]:#[fg=colour250]#W#[fg=colour244]#F '

setw -g window-status-bell-style 'fg=colour255 bg=colour1 bold'

# messages
# fill= is required since tmux 3.8: the command prompt only clears the status
# line if the style carries an explicit fill= directive
set -g message-style 'fg=colour232 bg=colour45 bold fill=colour45'

# popups (used by the session pickers and anything else display-popup)
set -g popup-style 'fg=colour253,bg=colour236'
set -g popup-border-style 'fg=colour39'
set -g popup-border-lines rounded


#######################
### WINDOWS and WSL ###
#######################
if-shell 'grep -qi microsoft /proc/version' {  # Check if running in WSL
    bind-key -T copy-mode-vi y send -X copy-pipe-and-cancel "clip.exe"
}


# Treat regional indicator letters as width 1 so flag emoji pairs (U+1F1E6-1F1FF)
# stay adjacent and the terminal can ligate them into a flag glyph
set -as codepoint-widths "U+1F1E6-U+1F1FF=1"
